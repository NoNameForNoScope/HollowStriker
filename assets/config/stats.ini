; Sistemul de statistici (src/stats/statistics_system.cpp). Datele se salveaza in data/*.csv.

[sampling]
; secunde intre esantioanele fiziologice (puls, stres, stamina, oboseala ...)
interval = 0.5

[engagement]
; angajamentul se incheie dupa atatea secunde fara activitate de lupta
timeout = 5.0
; "sub foc": secunde dupa un glont pe langa / o lovitura primita
under_fire_window = 1.5
; inamicul vizat la foc (pentru distanta focurilor ratate): conul in jurul privirii (grade)
aim_cone_deg = 20
; asistenta: dauna data cu cel mult atatea secunde inainte ca altcineva sa ucida tinta
assist_window = 15
; "dupa sprint": focul tras la cel mult atatea secunde dupa ultimul sprint
sprint_memory = 5

[match]
; un meci = runde pana cand o echipa ajunge la rounds_to_win (sau max_rounds runde jucate)
rounds_to_win = 3
max_rounds = 7

[score]
kill = 100
assist = 50
headshot = 25
round_win = 150
objective = 200
; puncte pe punct de dauna
damage = 1.0
