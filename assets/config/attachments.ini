; Catalogul de atasamente (date, nu cod). Fiecare sectiune = un atasament.
; type (locasul): optic, muzzle, underbarrel, magazine, stock, light, laser, barrel - un atasament pe locas.
; visual (forma desenata pe arma): reddot, holo, scope, suppressor, compensator, brake, flashhider,
;   vgrip, agrip, extmag, drum, heavystock, lightstock, light, laser, longbarrel, shortbarrel
; Multiplicatori (1 = fara efect, se scriu doar cei relevanti):
;   recoil_v / recoil_h (recul), spread (dispersie), ads (timp de ochire), sway (leganare),
;   kick (lovitura camerei), switch (scoatere / toc), reload (reincarcare), sound (raza de auz),
;   flash (flama), move (viteza de deplasare), velocity (viteza glontului), stability (revenirea dupa recul)
; Aditivi: weight (kg), length (m), mag (cartuse). Optica: sight_height (m), magnification, eye_relief (m).
; fits: categoriile compatibile (rifle, smg, pistol, shotgun, sniper).

