; Fiziologia corpului: stres, adrenalina, puls, respiratie, tensiune, tremur, descarcarea de adrenalina.
; Valori de reglaj (gameplay), nu simulare medicala. Curbele se scriu "x:y, x:y, ..." (interpolare liniara).
;
; Lantul: stimul -> impuls -> memoria stresului -> stres tinta -> stres curent (doua trepte de intarziere)
;   -> adrenalina (curba proprie) -> puls -> respiratie -> tensiune musculara -> motricitate fina
;   -> miscarea corpului: trunchi -> umeri -> brate -> maini -> arma; camera primeste doar o fractiune mica.

[stress]
onset = 0.35            ; s: prima treapta (intarzierea fiziologica)
rise = 1.2              ; s: a doua treapta la crestere
fall = 2.5              ; s: a doua treapta la scadere (revenirea propriu-zisa vine din memorie)
saturation = 0.5        ; impulsurile conteaza mai putin cand memoria e deja plina
memory_max = 1.6
response = 1.5          ; stres tinta = 1 - exp(-response x memorie): lupta grea -> platou ~0.85, nu 100%
; revenirea memoriei (1/s) dupa context
recover_safe = 0.060
recover_gone = 0.035
recover_nearby = 0.012
recover_combat = 0.003
prolonged_combat = 0.5  ; dupa lupta lunga revenirea e cu pana la 50% mai lenta
tactical_calm = 0.03    ; 1/s in plus la revenire cu respiratie tactica (merge si in lupta)
; benzi (0..1): CALM < 0.20 < ALERT < 0.40 < TENSIONAT < 0.60 < STRES MARE < 0.80 < STRES EXTREM < 0.95 < PANICA
th_alert = 0.20
th_elevated = 0.40
th_high = 0.60
th_extreme = 0.80
th_panic = 0.95
hysteresis = 0.03

[context]
active = 4              ; s de la ultima amenintare: lupta activa
nearby = 15             ; pericol in apropiere
safe = 40               ; zona sigura
combat_load_time = 180  ; s de lupta pana la "lupta lunga"

[impulses]
; eveniment = stres, adrenalina, pericol (da / nu: opreste revenirea), obisnuire (da / nu: stimul repetitiv)
small_sound = 0.02, 0.01, nu, da
distant_gunfire = 0.04, 0.03, nu, da
nearby_gunfire = 0.07, 0.08, da, da
near_miss = 0.10, 0.14, da, da
impact_near = 0.05, 0.06, da, da
enemy_appears = 0.12, 0.20, da, nu
minor_damage = 0.15, 0.30, da, nu
severe_damage = 0.35, 0.55, da, nu
explosion = 0.35, 0.45, da, nu
ally_down = 0.22, 0.15, da, nu
malfunction = 0.08, 0.05, nu, nu
own_shot = 0.006, 0.004, nu, da
sudden = 0.06, 0.10, da, nu

[habituation]
; acelasi stimul repetat des conteaza tot mai putin (pana la -60%), revine dupa o pauza (~30 s)
gain = 0.2
decay = 0.03
max = 0.6

[continuous]
; memorie / s
darkness = 0.006
alone = 0.003
combat = 0.008          ; lupta sustinuta (x 0.5..1.5 dupa durata luptei)
proximity = 0.03        ; inamic vizibil aproape
exhaustion = 0.012

[persistent]
; intra direct in tinta (nu se "uita" cat timp dureaza)
low_health = 0:0.45, 0.15:0.35, 0.35:0.15, 0.6:0
downed = 0.5

[adrenaline]
from_stress = 0:0, 0.2:0.02, 0.4:0.15, 0.6:0.4, 0.8:0.7, 1:0.85
surge_decay = 0.08      ; 1/s: valul de la evenimente bruste
surge_max = 0.9
combat = 0.2            ; adrenalina sustinuta de lupta lunga
critical_health = 0.5
onset = 0.8             ; s: intarzierea eliberarii
rise = 2.0              ; s
decay = 0.025           ; 1/s dupa pericol (~40 s)
decay_combat = 0.008    ; 1/s in lupta
peak_decay = 0.01
peak_state = 0.7        ; pragul starii "varf de adrenalina"

[dump]
; descarcarea de adrenalina: dupa un varf, cand pericolul a trecut (greutate, nu tremur violent).
; Intensitatea creste pe masura ce adrenalina scade si se stinge in ultima parte a duratei.
threshold = 0.45
delay = 4
rise = 3
duration = 0.45:25, 0.7:50, 1:90
combat_extend = 0.6
fatigue = 0.18
heart_rate = 14
breathing = 0.12
fine_motor = 0.10
stamina_regen = 0.35
sway = 0.15
tremor_low = 0.0005

