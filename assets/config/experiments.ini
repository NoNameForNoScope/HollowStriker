; Experimente controlate (tableta: STATISTICI -> EXPER, sau: bodycam_exp --experiment <cheie>).
; Fiecare experiment variaza UN factor; restul conditiilor sunt fixe. reps = replicari pe nivel
; (numere aleatoare comune intre niveluri). Rezultatele se salveaza in data/experiments.csv.
;
; factor: stress | sprint | hr | fatigue | arm_injury | distance | size | weapon
; measure: accuracy (%) | mre (m, abaterea impacturilor) | sway_rms (mrad, instabilitatea armei)
;          | tremor_rms (mrad) | reload_mean (s) | hr_mean (BPM)

[stres_precizie]
name = STRES -> PRECIZIE
question = Scade precizia cand creste stresul?
factor = stress
levels = 0, 0.25, 0.5, 0.75, 1.0
weapon = mk18
distance = 50
size = 0
shots = 20
reps = 10
measure = accuracy

[sprint_precizie]
name = SPRINT -> PRECIZIE
question = Sprintul dinaintea tragerii reduce precizia?
factor = sprint
unit = s
levels = 0, 4, 8, 16
weapon = mk18
distance = 50
size = 0
shots = 15
reps = 10
measure = accuracy

[puls_stabilitate]
name = PULS -> STABILITATEA ARMEI
question = Pulsul ridicat creste instabilitatea armei?
factor = hr
unit = BPM
levels = 70, 100, 130, 160, 180
weapon = mk18
distance = 25
shots = 15
reps = 8
measure = sway_rms

[distanta_precizie]
name = DISTANTA -> PRECIZIE
question = Distanta de angajare afecteaza precizia?
factor = distance
unit = m
levels = 10, 25, 50, 100
weapon = mk18
size = 1
shots = 15
reps = 8
measure = accuracy

[arme_precizie]
name = PRECIZIA ARMELOR
question = Care arma are cea mai buna precizie?
factor = weapon
weapons = mk18, mp5, g17, m870, m24
levels = 0, 1, 2, 3, 4
distance = 50
size = 1
shots = 15
reps = 8
measure = accuracy

[oboseala_reincarcare]
name = OBOSEALA -> REINCARCARE
question = Oboseala creste timpul de reincarcare?
factor = fatigue
levels = 0, 0.25, 0.5, 0.75, 1.0
weapon = mk18
distance = 25
shots = 4
reloads = 4
reps = 6
measure = reload_mean

[brat_stabilitate]
name = BRAT RANIT -> STABILITATE
question = Rana la brat creste instabilitatea armei?
factor = arm_injury
levels = 0, 0.3, 0.6, 0.9
weapon = mk18
distance = 25
shots = 15
reps = 8
measure = sway_rms

[marime_tinta]
name = MARIMEA TINTEI -> PRECIZIE
question = Cat depinde precizia de marimea tintei?
factor = size
levels = 0, 1, 2
weapon = mk18
distance = 50
shots = 15
reps = 8
measure = accuracy
