; Calculul centralizat al comportamentului armei (src/sim/weapon_stats.cpp).
; Arma (WeaponData + atasamente) da valorile de baza; aici sunt efectele starii jucatorului.

[spread]
; postura (multiplicator)
crouch = 0.80
prone = 0.60
; x (1 + k * stres^2)
stress = 0.45
; x (1 + k * oboseala + k2 * (1 - stamina))
fatigue = 0.30
stamina = 0.25
; x (1 + k * puls ridicat, 100..175 BPM)
heart_rate = 0.20
; x (1 + k * rana la brat); un brat scos din uz: one_hand
arm_injury = 0.60
one_hand = 1.6

[recoil]
crouch = 0.80
prone = 0.55
; per m/s de deplasare
movement = 0.08
stamina = 0.25
stress = 0.25
fatigue = 0.20
heat = 0.15
arm_injury = 0.60
one_hand = 2.0
; armele mai grele decat aceasta masa (kg) se ridica mai putin
weight_ref = 3.4

[recovery]
stamina = 0.30
arm_injury = 0.35
fatigue = 0.25

[bipod]
; bipiedul ajuta doar culcat (arma sprijinita pe sol): multiplicatori
spread = 0.75
recoil = 0.6
sway = 0.35
