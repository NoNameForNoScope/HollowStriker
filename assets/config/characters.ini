; Culori: "r g b" liniar (0..1). helmet: none / ballistic / cap / beanie. vest: none / plate / rig.
; gloves: none / full / fingerless. height / build: scala inaltimii / latimii.
; weapon + attachments: arma principala (assets/weapons/<id>.ini) si atasamentele (attachments.ini).
; skill: multiplicator al erorii de ochire (mai mic = tragator mai bun).

