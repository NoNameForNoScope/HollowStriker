; Pozitia armei in prim-plan, pe tip de arma.
; Spatiul camerei: x dreapta, y jos, z inainte (metri). Unghiuri in radiani.
; hip        = originea armei (punctul de deasupra manerului) cand nu ochesti
; hip_rot    = rotire suplimentara la sold: girare, tangaj, ruliu (inclinarea armei)
; ads_dz     = optica mai departe (+) sau mai aproape (-) de ochi la ochire
; ads_fov    = campul vizual al armei la ochire, ca fractie din "CAMP VIZUAL ARMA" (setari)
; ads_wrist_drop = la ochire incheietura dreapta coboara (m), ca mana sa stea sub linia de ochire
; ads_hand_drop  = la ochire mana dreapta coboara pe maner (m): lemnul / corpul armei o acopera
; shoulder_* = umerii in pozitia de tragere (umarul stang vine inainte)
; elbow_*    = directia in care iese cotul (la sold / la ochire)
; Tipurile mostenesc valorile din [rifle] si le suprascriu doar pe cele scrise.

[rifle]
hip = 0.14 0.08 0.27
hip_rot = -0.12 0.03 -0.07
ads_dz = 0.0
ads_fov = 0.8
ads_wrist_drop = 0.015
shoulder_r = 0.17 0.15 -0.04
shoulder_l = -0.16 0.16 0.06
elbow_r = 0.8 0.9 -0.2
elbow_l = -0.5 1.0 0.0
elbow_r_ads = 1.0 0.5 -0.2
elbow_l_ads = -0.5 1.0 0.0

[smg]

[pistol]
