; Gadgeturi: masina RC cu camera si drona FPV.
; Toate valorile sunt in unitati SI (m, s, rad) daca nu se spune altfel.

[vehicle]
name = RC-1
; propulsie
max_speed = 7.0
max_reverse = 2.5
accel = 5.0
reverse_accel = 3.0
brake = 9.0
coast_drag = 0.9
; directie si aderenta
steer_max = 0.55
steer_rate = 8.0
; sensibilitatea comenzilor (comanda -> efect) si curba expo (0 liniar .. 1 cubic)
throttle_sensitivity = 1.0
steer_sensitivity = 1.0
steer_expo = 0.3
wheelbase = 0.32
track = 0.30
grip = 9.0
slip_decay = 6.0
; suspensie: arc + amortizor (tangaj / ruliu)
susp_stiffness = 120
susp_damping = 14
susp_pitch_gain = 0.012
susp_roll_gain = 0.012
susp_travel = 0.02
; geometrie
wheel_radius = 0.055
length = 0.44
ride_height = 0.06
radius = 0.22
; baterie: minute la acceleratie maxima continua
battery_minutes = 5.0
idle_drain = 0.05
cell_count = 2
; camera
cam_height = 0.20
cam_forward = 0.10
cam_tilt = 0.05
cam_fov = 110
cam_w = 256
cam_h = 144
; structura si avarii
hp = 60
impact_threshold = 4.0
impact_damage = 6.0
bullet_damage = 0.5
restitution = 0.3
smoke_below = 0.4

[drone]
name = DRONA FPV
; mod stabilizat
max_tilt = 0.5
level_gain = 7.0
yaw_rate = 2.6
climb_rate = 2.2
alt_gain = 0.45
; mod acro
acro_rate = 4.0
acro_yaw = 3.0
acro_response = 12
hover_throttle = 0.45
; sensibilitatea manetelor si curba expo (0 liniar .. 1 cubic)
stick_sensitivity = 1.0
stick_expo = 0.3
; tractiune si aer
thrust_to_weight = 2.2
drag_lin = 0.25
drag_quad = 0.06
; geometrie (cadru de 5 inch)
radius = 0.18
arm_length = 0.11
prop_radius = 0.064
prop_idle = 40
prop_max = 200
; baterie 4S
battery_minutes = 3.0
cell_count = 4
; camera
cam_uptilt = 0.35
cam_fov = 118
cam_w = 256
cam_h = 144
; structura si avarii
hp = 30
impact_threshold = 3.0
impact_damage = 8.0
bullet_damage = 1.0
restitution = 0.3
smoke_below = 0.35
