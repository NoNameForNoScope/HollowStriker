; Catalogul hartilor jucabile. Fiecare harta are un MapId unic (folosit in toate
; inregistrarile statistice). Dimensiunea, suprafata, obiectivele si distantele de
; angajare posibile sunt MASURATE din fisierul hartii la pornire (src/game/map_catalog.cpp).
; Hartile se regenereaza cu: python scripts/gen_maps.py

[urban]
id = 1
name = URBAN
file = maps/urban.txt
mode = elimination
description = Strazi in cruce, blocuri cu holuri si apartamente, magazine. Distante medii.

[industrial]
id = 2
name = INDUSTRIAL
file = maps/industrial.txt
mode = elimination
description = Hale cu rafturi, curte de containere, spatii deschise. Distante lungi.

[residential]
id = 3
name = REZIDENTIAL
file = maps/residential.txt
mode = elimination
description = Case cu camere mici, gradini cu garduri, multe colturi. Distante scurte.

[training]
id = 4
name = POLIGON
file = maps/training.txt
mode = training
range = config/range.ini
description = Poligon de tragere: culoare la 10/25/50/100 m, tinte fixe, mobile si reactive.

[tactical]
id = 5
name = TACTIC MARE
file = maps/tactical.txt
mode = objective
description = Teren mare: sat, complex industrial, camp deschis, cladire fortificata. Patru obiective.

[compound]
